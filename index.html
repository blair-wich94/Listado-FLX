<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listado de Equipos · Cacho-China</title>
<style>
  :root{
    --bg:#0b1220;--bg2:#131c31;--panel:#fff;--ink:#0f172a;--muted:#64748b;
    --line:#e2e8f0;--accent:#2563eb;--accent2:#0ea5e9;--err:#dc2626;
  }
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:#eef2f7;color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:282px;flex:0 0 282px;background:linear-gradient(180deg,#0b1220,#131c31);
    color:#cbd5e1;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 0 40px;border-right:1px solid #1e293b}
  .brand{padding:0 20px 16px;border-bottom:1px solid #1e293b;margin-bottom:12px}
  .brand h1{margin:0;font-size:16px;color:#fff;letter-spacing:.3px}
  .brand p{margin:4px 0 0;font-size:11.5px;color:#7c8ba1;text-transform:uppercase;letter-spacing:1px}
  .navlist{padding:0 10px;display:flex;flex-direction:column;gap:2px}
  .navlist button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:space-between;
    padding:9px 12px;border-radius:8px;font-size:13px;color:#cbd5e1;transition:.15s}
  .navlist button:hover{background:#1e293b;color:#fff}
  .navlist button.active{background:linear-gradient(90deg,#2563eb,#0ea5e9);color:#fff;font-weight:600}
  .navlist .cnt{font-size:10.5px;background:#1e293b;color:#94a3b8;border-radius:20px;padding:2px 7px;min-width:26px;text-align:center}
  .navlist button.active .cnt{background:rgba(255,255,255,.22);color:#fff}
  .navlist .idx{font-size:10px;color:#64748b;width:16px;text-align:right;flex:0 0 16px}
  .navlist button.active .idx{color:#dbeafe}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .searchbox{position:relative;flex:1;min-width:220px;max-width:520px}
  .searchbox input{width:100%;padding:10px 36px 10px 38px;border:1px solid var(--line);border-radius:10px;
    font-size:13.5px;outline:none;background:#f8fafc;transition:.15s}
  .searchbox input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.10)}
  .searchbox .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px}
  .searchbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#e2e8f0;
    color:#475569;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;display:none}
  .btn{border:1px solid var(--line);background:#fff;color:#334155;padding:9px 14px;border-radius:9px;
    cursor:pointer;font-size:12.5px;font-weight:600;transition:.15s;white-space:nowrap}
  .btn:hover{background:#f1f5f9;border-color:#cbd5e1}
  .btn.toggle.on{background:#0f172a;color:#fff;border-color:#0f172a}
  .content{padding:20px;flex:1}
  .sheethead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .sheethead h2{margin:0;font-size:19px;letter-spacing:-.2px}
  .sheethead .meta{font-size:12px;color:var(--muted)}
  .tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;
    max-height:calc(100vh - 190px);box-shadow:0 1px 3px rgba(15,23,42,.06);-webkit-overflow-scrolling:touch}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;table-layout:auto;min-width:max-content}
  thead th{position:sticky;top:0;z-index:5;background:#0f172a;color:#e2e8f0;text-align:left;
    padding:13px 16px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    border-bottom:2px solid #1e293b;white-space:nowrap;vertical-align:middle}
  tbody td{padding:12px 16px;border-bottom:1px solid #cbd5e1;vertical-align:top;line-height:1.55;
    word-break:break-word;overflow-wrap:anywhere;min-width:70px;border-left:4px solid transparent;
    transition:background .12s,border-left-color .12s}
  tbody tr:nth-child(odd)  td{background:#ffffff}
  tbody tr:nth-child(even) td{background:#eef2f7}
  tbody tr:nth-child(even) td:first-child{border-left-color:#bfdbfe}
  tbody tr:hover td{background:#dbeafe}
  tbody tr:hover td:first-child{border-left-color:#2563eb}
  tbody tr.secrow td{background:#1e3a8a !important;color:#f8fafc;font-weight:700;font-size:11.5px;
    letter-spacing:.7px;text-transform:uppercase;padding:10px 16px;
    border-bottom:2px solid #1e40af;border-left-color:#1e40af !important}
  td.subheader-cell{background:#475569 !important;color:#f8fafc !important;font-size:10.5px;
    font-weight:700;letter-spacing:.7px;text-transform:uppercase;padding:9px 16px;
    border-top:2px solid #1e293b;border-bottom:2px solid #1e293b;border-left:4px solid #0ea5e9;
    text-align:center;white-space:nowrap;min-width:70px;vertical-align:middle}
  td.subheader-cell.empty-cell{background:#1e293b !important;color:transparent !important;border-left-color:#0f172a}
  tbody tr.subheader-row:hover td.subheader-cell{background:#334155 !important;color:#fff !important}
  tbody tr.subheader-row:hover td.subheader-cell.empty-cell{background:#1e293b !important;color:transparent !important}
  tbody tr.indice-row td{padding:18px 22px;font-size:14px;border-bottom:2px solid #cbd5e1;border-left-width:6px}
  tbody tr.indice-row:nth-child(odd)  td{background:#ffffff}
  tbody tr.indice-row:nth-child(even) td{background:#eff6ff}
  tbody tr.indice-row td:first-child{border-left-color:#2563eb;font-weight:800;font-size:16px;
    color:#1e3a8a;text-align:center;min-width:70px}
  tbody tr.indice-row:nth-child(even) td:first-child{border-left-color:#0ea5e9}
  tbody tr.indice-row:hover td{background:#dbeafe}
  tbody tr.indice-row:hover td:first-child{border-left-color:#1e40af;background:#bfdbfe}
  td.money{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;
    min-width:130px;padding-left:20px;padding-right:20px}
  td.money .cur{font-size:10.5px;color:var(--muted);font-weight:600;margin-left:3px}
  td.money.is-total{font-weight:700;color:#166534;background:#f0fdf4}
  tbody tr:hover td.money.is-total{background:#dcfce7}
  th.col-img,td.col-img{text-align:center;min-width:120px;max-width:160px}
  th.col-id,td.col-id{min-width:80px;white-space:nowrap;font-weight:600}
  th.col-unit,td.col-unit{min-width:65px;text-align:center;white-space:nowrap}
  th.col-qty,td.col-qty{min-width:80px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  th.col-money,td.col-money{min-width:110px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  th.col-link,td.col-link{min-width:120px;max-width:220px;word-break:break-all;font-size:11.5px}
  th.col-desc,td.col-desc{min-width:280px;max-width:560px}
  th.col-text,td.col-text{min-width:120px;max-width:280px}
  th.col-cap,td.col-cap{min-width:140px;max-width:260px}
  td.num,td.calc{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;
    min-width:100px;padding-left:20px;padding-right:20px}
  td.calc{font-weight:600;color:#0f172a}
  td.err{color:var(--err);font-weight:700;background:#fef2f2 !important}
  td.empty{color:#cbd5e1}
  td a{color:var(--accent);text-decoration:none;border-bottom:1px dotted #93c5fd;word-break:break-all}
  td a:hover{color:#1d4ed8;border-bottom-style:solid}
  td.cat-link{min-width:230px;padding:10px 16px !important}
  .indice-link{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;
    background:#eff6ff;border:1px solid #bfdbfe;color:var(--accent);font-weight:600;font-size:13px;
    text-decoration:none;transition:.15s;cursor:pointer;line-height:1.2}
  .indice-link:hover{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8;transform:translateX(2px)}
  .indice-link::before{content:"→";font-weight:400;color:var(--muted);font-size:13px;transition:.15s}
  .indice-link:hover::before{color:var(--accent);transform:translateX(1px)}
  .indice-note{display:inline-block;color:#94a3b8;font-size:11.5px;font-style:italic;padding:4px 0}
  td.imgcell{text-align:center;padding:8px}
  td.imgcell img{max-width:140px;max-height:110px;border-radius:8px;cursor:zoom-in;
    transition:.15s;border:1px solid var(--line);object-fit:cover}
  td.imgcell img:hover{transform:scale(1.05);box-shadow:0 6px 16px rgba(0,0,0,.18)}
  td.empty-img{color:#cbd5e1;font-style:italic;font-size:11px;text-align:center}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;
    align-items:center;justify-content:center;z-index:1000;padding:30px;cursor:zoom-out}
  #lightbox img{max-width:90vw;max-height:90vh;border-radius:10px}
  .gresults{display:flex;flex-direction:column;gap:12px}
  .gcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent2);
    border-radius:10px;padding:14px 18px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .gcard .src{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    background:#e0f2fe;color:#0369a1;padding:3px 9px;border-radius:20px;margin-bottom:10px}
  .gcard dl{margin:0;display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:8px 18px}
  .gcard dt{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;line-height:1.4}
  .gcard dd{margin:0;font-size:12.5px;line-height:1.55}
  .empty-state{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:60px 20px;text-align:center;color:var(--muted)}
  .toolbar{display:flex;gap:8px;align-items:center;margin-left:auto}
  .badge-live{font-size:11.5px;color:var(--muted);margin-right:4px}
  @media (max-width:900px){
    .layout{flex-direction:column}
    .sidebar{position:static;width:100%;flex:none;height:auto;max-height:230px;padding-bottom:16px}
    .tablewrap{max-height:none}.content{padding:12px}thead th{position:static}
    tbody td{padding:10px 12px}tbody tr.indice-row td{padding:14px 16px;font-size:13px}
  }
  @media print{
    .sidebar,.topbar{display:none}
    .tablewrap{max-height:none;border:0;box-shadow:none;overflow:visible}
    table{min-width:0;font-size:10px}
    tbody td,thead th{padding:6px 8px}
    tbody td{background:#fff !important;border-left-color:transparent !important}
    .indice-link{background:transparent;border:0;padding:0;color:var(--ink);font-weight:600}
    .indice-link::before{content:""}
    body{background:#fff}
  }
</style>
</head>

      <div class="toolbar"><span class="badge-live" id="live"></span></div>
    </div>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="lightbox" onclick="this.style.display='none'"></div>

/* =========================================================
   PARSER + EVALUACIÓN DE FÓRMULAS
   ========================================================= */
const ORDER = Object.keys(SHEETS);
const DATA = {};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function inline(txt){return esc(txt).replace(/&lt;br\s*\/?&gt;/gi,'<br>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}

function colIdx(letter){let n=0;for(const c of letter.toUpperCase())n=n*26+(c.charCodeAt(0)-64);return n-1;}

function tryEvalFormula(formula,rowIdx,allRows){
  if(typeof formula!=='string'||!formula.startsWith('=')) return null;
  let expr=formula.slice(1).trim();
  expr=expr.replace(/SUM\(([A-Z]+)(\d+):([A-Z]+)(\d+)\)/gi,(m,c1s,r1s,c2s,r2s)=>{
    const c1=colIdx(c1s),c2=colIdx(c2s);
    const r1=parseInt(r1s)-1,r2=parseInt(r2s)-1;
    let sum=0;
    for(let r=Math.max(0,r1);r<=Math.min(allRows.length-1,r2);r++){
      for(let c=c1;c<=c2;c++){
        const v=parseFloat(allRows[r]?.cells[c]);
        if(!isNaN(v)) sum+=v;
      }
    }
    return String(sum);
  });
  expr=expr.replace(/([A-Z]+)(\d+)/gi,(m,col)=>{
    const c=colIdx(col);
    let v=parseFloat(allRows[rowIdx]?.cells[c]);
    if(isNaN(v)&&rowIdx>0) v=parseFloat(allRows[rowIdx-1]?.cells[c]);
    return isNaN(v)?'0':String(v);
  });
  if(/^[\d\s+\-*/().]+$/.test(expr)){
    try{
      const r=Function('"use strict"; return ('+expr+')')();
      if(typeof r==='number'&&isFinite(r)) return parseFloat(r.toFixed(2)).toString();
    }catch(e){}
  }
  return null;
}

function resolveFormulas(sheetData){
  const rows=sheetData.rows;
  for(let pass=0;pass<8;pass++){
    let changed=false;
    for(let r=0;r<rows.length;r++){
      for(let c=0;c<rows[r].cells.length;c++){
        const cell=rows[r].cells[c];
        if(typeof cell==='string'&&cell.startsWith('=')){
          const result=tryEvalFormula(cell,r,rows);
          if(result!==null){rows[r].cells[c]=result;changed=true;}
        }
      }
    }
    if(!changed) break;
  }
  for(const row of rows){
    for(let c=0;c<row.cells.length;c++){
      if(typeof row.cells[c]==='string'&&row.cells[c].startsWith('=')) row.cells[c]='';
    }
  }
}

function parseSheet(raw){
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows=[];
  for(let line of lines){
    if(!line.startsWith('|')) continue;
    let s=line.slice(1);
    if(s.endsWith('|')) s=s.slice(0,-1);
    const cells=s.split('|').map(c=>c.trim());

    let sec=false, subheader=false;
    if(cells[0] === '!!'){
      sec = true;
      cells.shift();
      const realContent = cells.filter(c =>
        c && !c.startsWith('=') && !/^#(VALUE|REF|N\/A|DIV)/i.test(c)
      ).length;
      if(realContent >= 2) subheader = true;
    }

    if(!sec && cells.length && cells.every(c=>/^:?-+:?$/.test(c))) continue;

    rows.push({sec, subheader, cells});
  }
  if(!rows.length) return {header:[],rows:[]};
  const maxCols=Math.max(...rows.map(r=>r.cells.length));
  rows.forEach(r=>{while(r.cells.length<maxCols) r.cells.push('');});
  const keep=[];
  for(let i=0;i<maxCols;i++) if(rows.some(r=>r.cells[i]!=='')) keep.push(i);
  rows.forEach(r=>{r.cells=keep.map(i=>r.cells[i]);});
  const head=rows.shift();
  const result={header:head.cells,rows};
  resolveFormulas(result);
  return result;
}

/* =========================================================
   MERGE UBICACION en CANCELERIAS
   ========================================================= */
function mergeUbicacionRows(sheetData){
  const uIdx    = sheetData.header.findIndex(h => /ubicaci[oó]n/i.test(String(h||'')));
  const claveIdx= sheetData.header.findIndex(h => /^clave$/i.test(String(h||'').trim()));
  const descIdx = sheetData.header.findIndex(h => /descripci/i.test(String(h||'')));
  if(uIdx < 0 || claveIdx < 0 || descIdx < 0) return;

  const out = [];
  for(let i=0;i<sheetData.rows.length;i++){
    const r = sheetData.rows[i];
    if(r.sec){ out.push(r); continue; }

    const tieneUbic = String(r.cells[uIdx]||'').trim() !== '';
    const sinClave  = String(r.cells[claveIdx]||'').trim() === '';
    const sinDesc   = String(r.cells[descIdx]||'').trim() === '';

    if(tieneUbic && sinClave && sinDesc && out.length){
      const prev = out[out.length-1];
      if(!prev.sec && !String(prev.cells[uIdx]||'').trim()){
        prev.cells[uIdx] = r.cells[uIdx];
        r.cells.forEach((c,j)=>{
          if(j === uIdx) return;
          const cv = String(c||'').trim();
          const pv = String(prev.cells[j]||'').trim();
          if(cv === '') return;
          if(pv === '' || (!/^-?[\d.,]+$/.test(pv) && /^-?[\d.,]+$/.test(cv))){
            prev.cells[j] = c;
          }
        });
        continue;
      }
    }
    out.push(r);
  }
  sheetData.rows = out;
}

/* Reordena CLAVE al inicio */
function reorderKeyFirst(sheetData){
  const idx = sheetData.header.findIndex(h =>
    /^(clave|id|c[oó]digo|no\.?)$/i.test(String(h).trim())
  );
  if(idx <= 0) return;
  const move = (arr) => { const [v] = arr.splice(idx,1); arr.unshift(v); };
  move(sheetData.header);
  sheetData.rows.forEach(r => move(r.cells));
}

function findSheetForLabel(label){
  const t=String(label).trim();
  if(!t) return null;
  if(ORDER.includes(t)) return t;
  const n=norm(t);
  if(Object.prototype.hasOwnProperty.call(INDICE_ALIAS,n)){

  const found=ORDER.find(k=>norm(k)===n);

/* =========================================================
   CLASIFICACIÓN Y FORMATO MONEDA
   ========================================================= */
function classifyHeader(h){
  const t=String(h||'').toLowerCase().trim();
  if(!t) return '';
  if(/imagen/.test(t)) return 'col-img';
  if(/^link|ficha t|link precio|referencia/.test(t)) return 'col-link';
  if(/^id$|^clave$|^código$|^codigo$|^no\.?$/.test(t)) return 'col-id';
  if(/unidad|unid\.?/.test(t)) return 'col-unit';
  if(/cantidad|cant\.?/.test(t)) return 'col-qty';
  if(/p\.u|total|importe|precio/.test(t)) return 'col-money';
  if(/descripci/.test(t)) return 'col-desc';
  if(/capacidad|medida|dimension/.test(t)) return 'col-cap';
  if(/equipo|mueble|accesorio|tipo|marca|modelo|acabado/.test(t)) return 'col-text';
  return '';
}

function isMoneyHeader(h){
  return /\bp\.?\s*u\b|total|importe|precio/i.test(String(h||''));
}
function isTotalHeader(h){
  return /total|importe/i.test(String(h||''));
}
function fmtMXN(n){
  return '$' + n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function cellHTML(raw, headerText){
  const t=String(raw).trim();
  const cls=classifyHeader(headerText);
  if(!t) return `<td${cls?` class="${cls} empty"`:' class="empty"'}>—</td>`;
  if(cls !== 'col-link' && isMoneyHeader(headerText) && /^-?[\d]+(\.\d+)?$/.test(t)){
    const n=parseFloat(t);
    const totalCls = isTotalHeader(headerText) ? ' is-total' : '';
    return `<td class="money${totalCls}">${fmtMXN(n)}<span class="cur">MXN</span></td>`;
  }
  const h=inline(t);
  const extra=[];
  if(/#(VALUE|REF|N\/A|DIV\/0)/i.test(t)) extra.push('err');
  else if(/^-?[\d,]+(\.\d+)?$/.test(t)) extra.push('num');
  const allClasses=[cls,...extra].filter(Boolean).join(' ');
  return `<td${allClasses?` class="${allClasses}"`:''}>${h}</td>`;
}

function findImageUrl(cells){
  for(const cell of cells){
    const v = String(cell||'').trim();
    if(/^https?:\/\/[^\s]+\.(jpg|jpeg|png|webp|gif)(\?[^\s]*)?$/i.test(v)) return v;
  }
  return null;
}

      return /^\d+$/.test(first);
    });
  }

  let html=`<div class="sheethead">
      <h2>${esc(key)}</h2>
      <div class="meta">${
        isIndice
          ? `${rowsToRender.length} categorías · haz clic en cualquiera para abrir su hoja`
          : `${rowsToRender.filter(r=>!r.sec).length} registros · ${nCols} columnas`

  const codeIdx=d.header.findIndex(h=>/^clave$|^id$/i.test(h.trim()));

  html+=`<div class="tablewrap"><table><thead><tr>`;
  d.header.forEach(h=>{
    const cls=classifyHeader(h);

      if(r.subheader){
        html += `<tr class="subheader-row">`;
        for(let i=0;i<nCols;i++){
          const v = r.cells[i] || '';
          if(v) html += `<td class="subheader-cell">${inline(v)}</td>`;
          else html += `<td class="subheader-cell empty-cell">—</td>`;
        }
        html += `</tr>`;
      } else {
        const txt = r.cells.filter(c => c && !/^#(VALUE|REF|N\/A|DIV)/i.test(c))
                           .map(c=>inline(c)).join(' &nbsp;·&nbsp; ');
        html += `<tr class="secrow"><td colspan="${nCols}">${txt}</td></tr>`;
      }
      return;
    }

    const code = codeIdx>=0 ? (r.cells[codeIdx]||'').trim() : '';
    const imgMap = IMAGENES[code];
    const imgDynamic = imgMap ? null : findImageUrl(r.cells);
    const imgUrl = imgMap || imgDynamic;
    const trClass = isIndice ? ' class="indice-row"' : '';

    html += `<tr${trClass}>`;
    r.cells.forEach((c,i)=>{
      const headerTxt=(d.header[i]||'').toUpperCase();

      if(isIndice && i === catColIdx && String(c).trim() !== ''){
        const target = findSheetForLabel(c);
        if(target){
          html += `<td class="cat-link"><a href="#" class="indice-link" data-sheet="${esc(target)}" title="Ir a ${esc(target)}">${esc(String(c).trim())}</a></td>`;
        } else {
          html += `<td class="cat-link"><span class="indice-note">${esc(String(c).trim())} · (sin hoja)</span></td>`;
        }
        return;
      }

      if(headerTxt.includes('IMAGEN')){
        if(imgUrl){
          html += `<td class="imgcell"><img src="${esc(imgUrl)}" alt="${esc(code)}" loading="lazy" onclick="abrirLightbox('${esc(imgUrl)}')" onerror="this.parentElement.classList.add('empty-img');this.parentElement.innerHTML='Sin imagen';"></td>`;
        } else {
          html += `<td class="imgcell empty-img">Sin imagen</td>`;
        }
        return;
      }

      html += cellHTML(c, d.header[i]);
    });
    html += `</tr>`;
  });

  html+=`</tbody></table></div>`;
  content.innerHTML=html;
  updateLive();

  content.querySelectorAll('.indice-link').forEach(el=>{
    el.addEventListener('click', e=>{
      e.preventDefault();
      selectSheet(el.dataset.sheet);
    });
  });
}

function filterLocal(q){
  const nq=norm(q);let shown=0,total=0;
  content.querySelectorAll('tbody tr').forEach(tr=>{
    if(tr.classList.contains('secrow') || tr.classList.contains('subheader-row')){
      tr.classList.toggle('hide', !!nq);
      return;
    }
    total++;
    const hit=!nq||norm(tr.textContent).includes(nq);
    tr.classList.toggle('hide',!hit);
    if(hit) shown++;
  });
  live.textContent=nq?`${shown} de ${total} registros`:'';
}

function renderGlobal(q){
  const nq=norm(q);
  const results=[];
  ORDER.forEach(key=>{
    DATA[key].rows.forEach(r=>{
      if(r.sec) return;
      if(norm(r.cells.join(' ')).includes(nq)) results.push({key,cells:r.cells,header:DATA[key].header});
    });
  });
  let html=`<div class="sheethead">
      <h2>🌐 Resultados globales</h2>
      <div class="meta">${results.length} coincidencias para “${esc(q)}” en ${ORDER.length} hojas</div>
    </div>`;
  if(!results.length){content.innerHTML=html+`<div class="empty-state">Sin coincidencias.</div>`;live.textContent='0 resultados';return;}
  html+=`<div class="gresults">`;
  results.slice(0,400).forEach(r=>{
    html+=`<div class="gcard"><span class="src">${esc(r.key)}</span><dl>`;
    r.cells.forEach((c,i)=>{if(!c) return;html+=`<dt>${inline(r.header[i]||('Col '+(i+1)))}</dt><dd>${inline(c)}</dd>`;});
    html+=`</dl></div>`;
  });
  if(results.length>400) html+=`<div class="empty-state">Mostrando 400 de ${results.length} resultados. Refina la búsqueda.</div>`;
  html+=`</div>`;
  content.innerHTML=html;
  live.textContent=`${results.length} resultados`;
}

function updateLive(){
  const d=DATA[currentKey];
  live.textContent=`${d.rows.filter(r=>!r.sec).length} registros`;
}

let tmr;
qInput.addEventListener('input',()=>{
  const q=qInput.value.trim();
  clrBtn.style.display=q?'block':'none';
  clearTimeout(tmr);
  tmr=setTimeout(()=>{
    if(globalMode){
      if(q.length<2){live.textContent='Escribe al menos 2 caracteres';return;}
      renderGlobal(q);
    } else { filterLocal(q); }
  },160);
});

clrBtn.addEventListener('click',()=>{
  qInput.value='';clrBtn.style.display='none';
  if(globalMode){selectSheet(currentKey);} else {filterLocal('');qInput.focus();}
});

btnGlobal.addEventListener('click',()=>{
  globalMode=!globalMode;
  btnGlobal.classList.toggle('on',globalMode);
  if(globalMode){
    const q=qInput.value.trim();
    if(q.length<2){
      content.innerHTML=`<div class="empty-state"><strong>Búsqueda global activada</strong><br><br>Escribe al menos 2 caracteres para buscar en las ${ORDER.length} hojas del archivo.</div>`;
      live.textContent='';
    } else { renderGlobal(q); }
  } else { selectSheet(currentKey); }
});

document.getElementById('btnPrint').addEventListener('click',()=>window.print());
document.getElementById('btnCSV').addEventListener('click',()=>{
  const d=DATA[currentKey];
  const clean=v=>'"'+String(v).replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/"/g,'""')+'"';
  let csv=d.header.map(clean).join(',')+'\n';
  d.rows.forEach(r=>{csv+=r.cells.map(clean).join(',')+'\n';});
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=currentKey.replace(/[^\w\-]+/g,'_')+'.csv';
  a.click();URL.revokeObjectURL(a.href);
});

document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==qInput){e.preventDefault();qInput.focus();}
  if(e.key==='Escape'){qInput.value='';clrBtn.style.display='none';if(globalMode)selectSheet(currentKey);else filterLocal('');}
});

function abrirLightbox(src){
  const lb=document.getElementById('lightbox');
  lb.innerHTML='<img src="'+src+'">';
  lb.style.display='flex';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lightbox').style.display='none';});

selectSheet(ORDER[0]);
</script>
