<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listado de Equipos · Cacho-China</title>
<style>
  :root{
    --bg:#0b1220;--bg2:#131c31;--panel:#fff;--ink:#0f172a;--muted:#64748b;
    --line:#e2e8f0;--accent:#2563eb;--accent2:#0ea5e9;--err:#dc2626;--formula:#7c3aed;
  }
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:#eef2f7;color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:282px;flex:0 0 282px;background:linear-gradient(180deg,#0b1220,#131c31);
    color:#cbd5e1;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 0 40px;border-right:1px solid #1e293b}
  .brand{padding:0 20px 16px;border-bottom:1px solid #1e293b;margin-bottom:12px}
  .brand h1{margin:0;font-size:16px;color:#fff;letter-spacing:.3px}
  .brand p{margin:4px 0 0;font-size:11.5px;color:#7c8ba1;text-transform:uppercase;letter-spacing:1px}
  .navlist{padding:0 10px;display:flex;flex-direction:column;gap:2px}
  .navlist button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:space-between;
    padding:9px 12px;border-radius:8px;font-size:13px;color:#cbd5e1;transition:.15s}
  .navlist button:hover{background:#1e293b;color:#fff}
  .navlist button.active{background:linear-gradient(90deg,#2563eb,#0ea5e9);color:#fff;font-weight:600}
  .navlist .cnt{font-size:10.5px;background:#1e293b;color:#94a3b8;border-radius:20px;padding:2px 7px;min-width:26px;text-align:center}
  .navlist button.active .cnt{background:rgba(255,255,255,.22);color:#fff}
  .navlist .idx{font-size:10px;color:#64748b;width:16px;text-align:right;flex:0 0 16px}
  .navlist button.active .idx{color:#dbeafe}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .searchbox{position:relative;flex:1;min-width:220px;max-width:520px}
  .searchbox input{width:100%;padding:10px 36px 10px 38px;border:1px solid var(--line);border-radius:10px;
    font-size:13.5px;outline:none;background:#f8fafc;transition:.15s}
  .searchbox input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.10)}
  .searchbox .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px}
  .searchbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#e2e8f0;
    color:#475569;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;display:none}
  .btn{border:1px solid var(--line);background:#fff;color:#334155;padding:9px 14px;border-radius:9px;
    cursor:pointer;font-size:12.5px;font-weight:600;transition:.15s;white-space:nowrap}
  .btn:hover{background:#f1f5f9;border-color:#cbd5e1}
  .btn.primary{background:linear-gradient(90deg,#2563eb,#0ea5e9);color:#fff;border:0}
  .btn.toggle.on{background:#0f172a;color:#fff;border-color:#0f172a}
  .content{padding:20px;flex:1}
  .sheethead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .sheethead h2{margin:0;font-size:19px;letter-spacing:-.2px}
  .sheethead .meta{font-size:12px;color:var(--muted)}
  .tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;
    max-height:calc(100vh - 190px);box-shadow:0 1px 3px rgba(15,23,42,.06)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
  thead th{position:sticky;top:0;z-index:5;background:#0f172a;color:#e2e8f0;text-align:left;
    padding:10px 12px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    border-bottom:1px solid #1e293b;white-space:nowrap}
  tbody td{padding:9px 12px;border-bottom:1px solid #eef2f7;vertical-align:top;line-height:1.5;
    max-width:520px;word-break:break-word}
  tbody tr:nth-child(even) td{background:#fafbfd}
  tbody tr:hover td{background:#eff6ff}
  tbody tr.secrow td{background:#dbeafe !important;color:#1e3a8a;font-weight:700;font-size:11.5px;
    letter-spacing:.6px;text-transform:uppercase;padding:8px 12px}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.calc{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:#0f172a;font-weight:600}
  td.err{color:var(--err);font-weight:700;background:#fef2f2 !important}
  td.empty{color:#cbd5e1}
  td a{color:var(--accent);text-decoration:none;border-bottom:1px dotted #93c5fd;word-break:break-all}
  td a:hover{color:#1d4ed8;border-bottom-style:solid}
  .gresults{display:flex;flex-direction:column;gap:12px}
  .gcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent2);
    border-radius:10px;padding:12px 14px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .gcard .src{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    background:#e0f2fe;color:#0369a1;padding:3px 9px;border-radius:20px;margin-bottom:8px}
  .gcard dl{margin:0;display:grid;grid-template-columns:minmax(110px,190px) 1fr;gap:5px 14px}
  .gcard dt{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .gcard dd{margin:0;font-size:12.5px;line-height:1.5}
  .empty-state{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:60px 20px;text-align:center;color:var(--muted)}
  .toolbar{display:flex;gap:8px;align-items:center;margin-left:auto}
  .badge-live{font-size:11.5px;color:var(--muted);margin-right:4px}
  @media (max-width:900px){
    .layout{flex-direction:column}
    .sidebar{position:static;width:100%;flex:none;height:auto;max-height:230px;padding-bottom:16px}
    .tablewrap{max-height:none}.content{padding:12px}thead th{position:static}
  }
  @media print{.sidebar,.topbar{display:none}.tablewrap{max-height:none;border:0;box-shadow:none}body{background:#fff}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><h1>Listado de Equipos</h1><p>Cacho · China</p></div>
    <nav class="navlist" id="nav"></nav>

      <div class="toolbar"><span class="badge-live" id="live"></span></div>
    </div>
    <main class="content" id="content"></main>
  </div>
</div>

/* =========================================================
   PARSEO Y EVALUACIÓN DE FÓRMULAS
   ========================================================= */
const ORDER = Object.keys(SHEETS);
const DATA = {};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function inline(txt){return esc(txt).replace(/&lt;br\s*\/?&gt;/gi,'<br>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}

function colIdx(letter){
  let n=0; for(const c of letter.toUpperCase()) n=n*26+(c.charCodeAt(0)-64);
  return n-1;
}

function tryEvalFormula(formula, rowIdx, allRows){
  if(typeof formula!=='string' || !formula.startsWith('=')) return null;
  let expr = formula.slice(1).trim();

  // 1) SUM(range) → intenta sumar el rango en filas parseadas
  expr = expr.replace(/SUM\(([A-Z]+)(\d+):([A-Z]+)(\d+)\)/gi, (m,c1s,r1s,c2s,r2s)=>{
    const c1=colIdx(c1s), c2=colIdx(c2s);
    const r1=parseInt(r1s)-1, r2=parseInt(r2s)-1;
    let sum=0;
    for(let r=Math.max(0,r1); r<=Math.min(allRows.length-1,r2); r++){
      for(let c=c1; c<=c2; c++){
        const v=parseFloat(allRows[r]?.cells[c]);
        if(!isNaN(v)) sum+=v;
      }
    }
    return String(sum);
  });

  // 2) Referencias de celda: usa la fila actual (y si está vacío, la de arriba)
  expr = expr.replace(/([A-Z]+)(\d+)/gi, (m,col)=>{
    const c=colIdx(col);
    let v=parseFloat(allRows[rowIdx]?.cells[c]);
    if(isNaN(v) && rowIdx>0) v=parseFloat(allRows[rowIdx-1]?.cells[c]);
    return isNaN(v)?'0':String(v);
  });

  // 3) Evaluar expresión resultante
  if(/^[\d\s+\-*/().]+$/.test(expr)){
    try{
      const r=Function('"use strict"; return ('+expr+')')();
      if(typeof r==='number'&&isFinite(r)) return parseFloat(r.toFixed(2)).toString();
    }catch(e){}
  }
  return null;
}

function resolveFormulas(sheetData){
  const rows=sheetData.rows;
  for(let pass=0; pass<8; pass++){
    let changed=false;
    for(let r=0;r<rows.length;r++){
      for(let c=0;c<rows[r].cells.length;c++){
        const cell=rows[r].cells[c];
        if(typeof cell==='string' && cell.startsWith('=')){
          const result=tryEvalFormula(cell,r,rows);
          if(result!==null){
            rows[r].cells[c]=result;
            changed=true;
          }
        }
      }
    }
    if(!changed) break;
  }
  // Fórmulas no resueltas → se dejan vacías
  for(const row of rows){
    for(let c=0;c<row.cells.length;c++){
      if(typeof row.cells[c]==='string' && row.cells[c].startsWith('=')){
        row.cells[c]='';
      }
    }
  }
}

function parseSheet(raw){
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows=[];
  for(let line of lines){
    let sec=false;
    if(line.startsWith('!!')){sec=true; line=line.slice(2).trim();}
    if(!line.startsWith('|')) continue;
    let s=line.slice(1);
    if(s.endsWith('|')) s=s.slice(0,-1);
    const cells=s.split('|').map(c=>c.trim());
    if(!sec && cells.length && cells.every(c=>/^:?-+:?$/.test(c))) continue;
    rows.push({sec, cells});
  }
  if(!rows.length) return {header:[], rows:[]};
  const maxCols=Math.max(...rows.map(r=>r.cells.length));
  rows.forEach(r=>{while(r.cells.length<maxCols) r.cells.push('');});
  const keep=[];
  for(let i=0;i<maxCols;i++) if(rows.some(r=>r.cells[i]!=='')) keep.push(i);
  rows.forEach(r=>{r.cells=keep.map(i=>r.cells[i]);});
  const head=rows.shift();
  const result={header:head.cells, rows};
  resolveFormulas(result); // evalúa todas las fórmulas
  return result;
}

ORDER.forEach(k=>{DATA[k]=parseSheet(SHEETS[k]);});

const nav=document.getElementById('nav');
const content=document.getElementById('content');
const qInput=document.getElementById('q');
const clrBtn=document.getElementById('clr');
const btnGlobal=document.getElementById('btnGlobal');
const live=document.getElementById('live');

let currentKey=ORDER[0];
let globalMode=false;

ORDER.forEach((key,i)=>{
  const b=document.createElement('button');
  b.dataset.key=key;
  b.innerHTML=`<span style="display:flex;align-items:center;gap:10px;min-width:0">
      <span class="idx">${i+1}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(key)}</span>
    </span>
    <span class="cnt">${DATA[key].rows.filter(r=>!r.sec).length}</span>`;
  b.addEventListener('click',()=>selectSheet(key));
  nav.appendChild(b);
});

function selectSheet(key){
  globalMode=false;
  btnGlobal.classList.remove('on');
  currentKey=key;
  [...nav.children].forEach(b=>b.classList.toggle('active',b.dataset.key===key));
  renderSheet(key);
  qInput.value=''; clrBtn.style.display='none';
  document.querySelector('.content').scrollTop=0;
}

function cellHTML(raw){
  const t=String(raw).trim();
  if(!t) return `<td class="empty"></td>`;
  const h=inline(t);
  const cls=[];
  if(/#(VALUE|REF|N\/A|DIV\/0)/i.test(t)) cls.push('err');
  else if(/^-?[\d,]+(\.\d+)?$/.test(t)) cls.push('num');
  return `<td${cls.length?` class="${cls.join(' ')}"`:''}>${h}</td>`;
}

function renderSheet(key){
  const d=DATA[key];
  const nCols=d.header.length;
  let html=`<div class="sheethead">
      <h2>${esc(key)}</h2>
      <div class="meta">${d.rows.filter(r=>!r.sec).length} registros · ${nCols} columnas</div>
    </div>`;
  if(!d.rows.length && !d.header.length){
    content.innerHTML=html+`<div class="empty-state">Hoja sin datos.</div>`; return;
  }
  html+=`<div class="tablewrap"><table><thead><tr>`;
  d.header.forEach(h=>html+=`<th>${inline(h)}</th>`);
  html+=`</tr></thead><tbody>`;
  d.rows.forEach(r=>{
    if(r.sec){
      const txt=r.cells.filter(c=>c).map(c=>inline(c)).join(' &nbsp;·&nbsp; ');
      html+=`<tr class="secrow"><td colspan="${nCols}">${txt}</td></tr>`;
      return;
    }
    html+=`<tr>`;
    r.cells.forEach(c=>html+=cellHTML(c));
    html+=`</tr>`;
  });
  html+=`</tbody></table></div>`;
  content.innerHTML=html;
  updateLive();
}

function filterLocal(q){
  const nq=norm(q); let shown=0,total=0;
  content.querySelectorAll('tbody tr').forEach(tr=>{
    if(tr.classList.contains('secrow')){tr.classList.toggle('hide',!!nq); return;}
    total++;
    const hit=!nq||norm(tr.textContent).includes(nq);
    tr.classList.toggle('hide',!hit);
    if(hit) shown++;
  });
  live.textContent=nq?`${shown} de ${total} registros`:'';
}

function renderGlobal(q){
  const nq=norm(q);
  const results=[];
  ORDER.forEach(key=>{
    DATA[key].rows.forEach(r=>{
      if(r.sec) return;
      if(norm(r.cells.join(' ')).includes(nq)) results.push({key,cells:r.cells,header:DATA[key].header});
    });
  });
  let html=`<div class="sheethead">
      <h2>🌐 Resultados globales</h2>
      <div class="meta">${results.length} coincidencias para “${esc(q)}” en ${ORDER.length} hojas</div>
    </div>`;
  if(!results.length){content.innerHTML=html+`<div class="empty-state">Sin coincidencias.</div>`;live.textContent='0 resultados';return;}
  html+=`<div class="gresults">`;
  results.slice(0,400).forEach(r=>{
    html+=`<div class="gcard"><span class="src">${esc(r.key)}</span><dl>`;
    r.cells.forEach((c,i)=>{ if(!c) return; html+=`<dt>${inline(r.header[i]||('Col '+(i+1)))}</dt><dd>${inline(c)}</dd>`; });
    html+=`</dl></div>`;
  });
  if(results.length>400) html+=`<div class="empty-state">Mostrando 400 de ${results.length} resultados. Refina la búsqueda.</div>`;
  html+=`</div>`;
  content.innerHTML=html;
  live.textContent=`${results.length} resultados`;
}

function updateLive(){
  const d=DATA[currentKey];
  live.textContent=`${d.rows.filter(r=>!r.sec).length} registros`;
}

let tmr;
qInput.addEventListener('input',()=>{
  const q=qInput.value.trim();
  clrBtn.style.display=q?'block':'none';
  clearTimeout(tmr);
  tmr=setTimeout(()=>{
    if(globalMode){
      if(q.length<2){live.textContent='Escribe al menos 2 caracteres';return;}
      renderGlobal(q);
    } else { filterLocal(q); }
  },160);
});

clrBtn.addEventListener('click',()=>{
  qInput.value=''; clrBtn.style.display='none';
  if(globalMode){selectSheet(currentKey);} else {filterLocal('');qInput.focus();}
});

btnGlobal.addEventListener('click',()=>{
  globalMode=!globalMode;
  btnGlobal.classList.toggle('on',globalMode);
  if(globalMode){
    const q=qInput.value.trim();
    if(q.length<2){
      content.innerHTML=`<div class="empty-state"><strong>Búsqueda global activada</strong><br><br>Escribe al menos 2 caracteres para buscar en las ${ORDER.length} hojas del archivo.</div>`;
      live.textContent='';
    } else { renderGlobal(q); }
  } else { selectSheet(currentKey); }
});

document.getElementById('btnPrint').addEventListener('click',()=>window.print());
document.getElementById('btnCSV').addEventListener('click',()=>{
  const d=DATA[currentKey];
  const clean=v=>'"'+String(v).replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/"/g,'""')+'"';
  let csv=d.header.map(clean).join(',')+'\n';
  d.rows.forEach(r=>{csv+=r.cells.map(clean).join(',')+'\n';});
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=currentKey.replace(/[^\w\-]+/g,'_')+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
});

document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==qInput){e.preventDefault();qInput.focus();}
  if(e.key==='Escape'){qInput.value='';clrBtn.style.display='none';if(globalMode)selectSheet(currentKey);else filterLocal('');}
});

selectSheet(ORDER[0]);
</script>
